<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Life Care Clinic</title>

    <style>

        body{
    margin:0;
    font-family:'Poppins', sans-serif;

    background: 
                url("https://images.unsplash.com/photo-1586773860418-d37222d8fce3") no-repeat center/cover;

    height:100vh;
}

        h1{
            text-align:center;
            margin-top:40px;
            letter-spacing:1px;
        }

        .container{
            width:80%;
            margin:auto;
            margin-top:60px;

            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
            gap:30px;
        }

        .card{
            background:white;
            color:#006666;
            padding:30px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 0 15px #00000040;
            transition:0.3s;
        }

        .card:hover{
            transform:scale(1.05);
        }

        .card a{
            text-decoration:none;
            color:#006666;
            font-weight:bold;
            font-size:18px;
        }

        .card p{
            margin-top:10px;
            font-size:14px;
        }

        .back{
            display:block;
            width:220px;
            margin:40px auto;
            text-align:center;
            padding:12px;
            background:white;
            color:#006666;
            border-radius:8px;
            text-decoration:none;
            font-weight:bold;
        }

        .back:hover{
            background:#00a6a6;
            color:white;
        }

    </style>
</head>

<body>

<h1>Admin Panel - Life Care Clinic</h1>

<div class="container">

    <!-- Queue -->
    <div class="card">
        <a href="{% url 'queue' %}">View Appointment Queue</a>
        <p>See all patient tokens and appointment details.</p>
    </div>

    <!-- Contact Messages -->
    <div class="card">
        <a href="{% url 'view_contacts' %}">View Contact Messages</a>
        <p>Check messages submitted from contact page.</p>
    </div>

    <!-- Patients -->
    <div class="card">
        <a href="{% url 'appointment' %}">Manage Patients</a>
        <p>Add or view patient appointments.</p>
    </div>

</div>

<a href="{% url 'dashboard' %}" class="back">Back to Dashboard</a>

</body>
</html>
